# Optional for the machine hosting PostgreSQL. Teammates can connect over JDBC without Docker.
services:
  postgres:
    image: postgres:16
    container_name: postgres_aita
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-AST_CodeAnalysisDB}
      POSTGRES_USER: ${DB_USER:-aita}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-55433}:5432"
    volumes:
      - aita_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  aita_postgres_data:
